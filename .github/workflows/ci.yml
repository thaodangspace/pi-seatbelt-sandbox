name: CI

on:
  push:
  pull_request:

jobs:
  linux-unit:
    name: Linux typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Package smoke test
        run: npm run test:package

  macos-integration:
    name: macOS typecheck and sandbox integration tests
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Show sandbox-exec availability
        run: command -v sandbox-exec && sandbox-exec -h || true

      - name: macOS sandbox integration tests
        run: npm run test:integration
